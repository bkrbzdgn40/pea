name: Temporary Roadmap 01 Analyzer Fix

on:
  push:
    branches:
      - refactor/frontend-roadmap-01-truthful-home-metrics

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'Remove unused Home placeholder tap behavior') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-01-truthful-home-metrics

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove unused placeholder tap behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/workout_analysis/presentation/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('class _HomeInsightPlaceholderCard extends StatelessWidget {')
          end = text.index('class _DashboardStats extends StatelessWidget {')

          replacement = '''class _HomeInsightPlaceholderCard extends StatelessWidget {
            const _HomeInsightPlaceholderCard({
              required this.title,
              required this.subtitle,
              required this.icon,
            });

            final String title;
            final String subtitle;
            final IconData icon;

            @override
            Widget build(BuildContext context) {
              return AppSurfaceCard(
                child: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(10),
                      decoration: BoxDecoration(
                        color: Colors.greenAccent.withValues(alpha: 0.12),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: Icon(icon, color: Colors.greenAccent, size: 22),
                    ),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            title,
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 16,
                              fontWeight: FontWeight.w800,
                            ),
                          ),
                          const SizedBox(height: 4),
                          Text(
                            subtitle,
                            style: const TextStyle(
                              color: Colors.white60,
                              fontSize: 13,
                              height: 1.3,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          '''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Format changed file
        run: dart format lib/features/workout_analysis/presentation/screens/home_screen.dart

      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/tmp-fix-roadmap-01.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/workout_analysis/presentation/screens/home_screen.dart .github/workflows/tmp-fix-roadmap-01.yml
          git commit -m "Remove unused Home placeholder tap behavior"
          git push origin HEAD:refactor/frontend-roadmap-01-truthful-home-metrics
