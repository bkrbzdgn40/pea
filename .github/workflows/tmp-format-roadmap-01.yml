name: Temporary Roadmap 01 Formatter

on:
  push:
    branches:
      - refactor/frontend-roadmap-01-truthful-home-metrics

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-01-truthful-home-metrics

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: >-
          dart format
          lib/features/workout_analysis/presentation/screens/home_screen.dart
          test/features/workout_analysis/presentation/screens/home_screen_test.dart
          test/features/workout_analysis/presentation/screens/home_truthful_metrics_test.dart

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/workout_analysis/presentation/screens/home_screen.dart \
            test/features/workout_analysis/presentation/screens/home_screen_test.dart \
            test/features/workout_analysis/presentation/screens/home_truthful_metrics_test.dart
          git commit -m "Format Roadmap 1 Dart changes"
          git push origin HEAD:refactor/frontend-roadmap-01-truthful-home-metrics
