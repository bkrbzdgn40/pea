name: Analyze Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture analyzer output
        run: flutter analyze > analyze.txt 2>&1 || true

      - name: Upload analyzer output
        uses: actions/upload-artifact@v4
        with:
          name: analyze-output
          path: analyze.txt
          if-no-files-found: error
