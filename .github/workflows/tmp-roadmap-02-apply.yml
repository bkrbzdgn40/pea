name: Temporary Roadmap 02 Implementation

on:
  push:
    branches:
      - refactor/frontend-roadmap-02-exercise-specific-score-trends

permissions:
  contents: write

jobs:
  apply-roadmap-02:
    if: ${{ !contains(github.event.head_commit.message, 'Implement exercise-specific score trends') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-02-exercise-specific-score-trends

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Roadmap 2 changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # Canonical score samples carry exercise identity.
          path = 'lib/features/workout_analysis/application/workout_statistics.dart'
          text = read(path)
          text = replace_once(
              text,
              "class WorkoutScoreSample {\n  const WorkoutScoreSample({required this.startedAt, required this.score});\n\n  final DateTime startedAt;\n  final double score;\n}",
              "class WorkoutScoreSample {\n  const WorkoutScoreSample({\n    required this.exerciseType,\n    required this.startedAt,\n    required this.score,\n  });\n\n  final String exerciseType;\n  final DateTime startedAt;\n  final double score;\n}",
              'WorkoutScoreSample identity',
          )
          text = replace_once(
              text,
              "  List<WorkoutScoreSample> latestScoreSamples({int limit = 7}) {",
              "  List<WorkoutScoreSample> scoreSamplesForExercise(String exerciseType) {\n    return chronologicalScoreSamples\n        .where((sample) => sample.exerciseType == exerciseType)\n        .toList(growable: false);\n  }\n\n  List<WorkoutScoreSample> latestScoreSamples({int limit = 7}) {",
              'exercise score filter',
          )
          write(path, text)

          path = 'lib/features/workout_analysis/application/workout_statistics_calculator.dart'
          text = read(path)
          text = replace_once(
              text,
              "          (session) => WorkoutScoreSample(\n            startedAt: session.startedAt,\n            score: session.averageScore,\n          ),",
              "          (session) => WorkoutScoreSample(\n            exerciseType: session.exerciseType,\n            startedAt: session.startedAt,\n            score: session.averageScore,\n          ),",
              'calculator sample exercise identity',
          )
          write(path, text)

          # Home dashboard no longer owns an ambiguous global trend.
          path = 'lib/features/workout_analysis/presentation/models/home_dashboard_data.dart'
          text = read(path)
          text = text.replace('    required this.scoreTrend,\n', '')
          text = text.replace('  final List<ScoreTrendPoint> scoreTrend;\n', '')
          text = re.sub(
              r"\n      scoreTrend: \[\n(?:        .*\n)+?      \],",
              '',
              text,
              count=1,
          )
          write(path, text)

          path = 'lib/features/workout_analysis/presentation/providers/home_dashboard_provider.dart'
          text = read(path)
          text = text.replace("import '../../application/workout_statistics.dart';\n", '')
          text = text.replace('    scoreTrend: _buildScoreTrend(statistics.latestScoreSamples()),\n', '')
          text = re.sub(
              r"\nList<ScoreTrendPoint> _buildScoreTrend\([\s\S]*?\n}\n\nList<ExerciseDistributionItem>",
              "\nList<ExerciseDistributionItem>",
              text,
              count=1,
          )
          text = re.sub(
              r"\nString _weekdayLabel\(DateTime dateTime\) \{[\s\S]*?\n}\n?$",
              '\n',
              text,
              count=1,
          )
          write(path, text)

          # Shared exercise-specific trend provider used by both Home and detail.
          write(
              'lib/features/workout_analysis/presentation/providers/exercise_score_trend_provider.dart',
              """import 'package:flutter_riverpod/flutter_riverpod.dart';

import '../../application/workout_statistics.dart';
import '../../application/workout_statistics_calculator.dart';
import '../../domain/models/exercise_type.dart';
import '../models/home_dashboard_data.dart';
import 'user_sessions_snapshot_provider.dart';

final exerciseScoreTrendProvider =
    FutureProvider.family<ExerciseScoreTrendData, ExerciseType>((ref, exercise) async {
      final snapshot = await ref.watch(userSessionsSnapshotProvider.future);
      final statistics = WorkoutStatisticsCalculator().calculate(snapshot.sessions);

      return ExerciseScoreTrendData(
        exercise: exercise,
        samples: snapshot.source == UserSessionsSnapshotSource.real
            ? statistics.scoreSamplesForExercise(exercise.id)
            : const <WorkoutScoreSample>[],
        source: snapshot.source,
      );
    });

class ExerciseScoreTrendData {
  ExerciseScoreTrendData({
    required this.exercise,
    required List<WorkoutScoreSample> samples,
    required this.source,
  }) : samples = List<WorkoutScoreSample>.unmodifiable(samples);

  final ExerciseType exercise;
  final List<WorkoutScoreSample> samples;
  final UserSessionsSnapshotSource source;

  bool get hasRealData =>
      source == UserSessionsSnapshotSource.real && samples.isNotEmpty;

  double get bestAverageScore {
    return samples.fold<double>(
      0,
      (best, sample) => sample.score > best ? sample.score : best,
    );
  }

  List<WorkoutScoreSample> latestSamples({int limit = 7}) {
    if (limit <= 0 || samples.isEmpty) {
      return const <WorkoutScoreSample>[];
    }
    if (samples.length <= limit) {
      return samples;
    }
    return samples.sublist(samples.length - limit);
  }

  List<ScoreTrendPoint> latestPoints({int limit = 7}) {
    return [
      for (final sample in latestSamples(limit: limit))
        ScoreTrendPoint(
          label: _weekdayLabel(sample.startedAt.toLocal()),
          score: sample.score,
        ),
    ];
  }
}

String _weekdayLabel(DateTime dateTime) {
  const labels = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
  return labels[dateTime.weekday - 1];
}
""",
          )

          # Mini trend explicitly names its exercise and form-score semantics.
          path = 'lib/features/workout_analysis/presentation/widgets/score_trend_card.dart'
          text = read(path)
          text = replace_once(
              text,
              "  const ScoreTrendCard({super.key, required this.points, this.onTap});\n\n  final List<ScoreTrendPoint> points;",
              "  const ScoreTrendCard({\n    super.key,\n    required this.exerciseTitle,\n    required this.points,\n    this.onTap,\n  });\n\n  final String exerciseTitle;\n  final List<ScoreTrendPoint> points;",
              'ScoreTrendCard constructor',
          )
          text = text.replace('                const Expanded(\n', '                Expanded(\n', 1)
          text = text.replace("                    'Skor Trendi',", "                    '$exerciseTitle Form Skoru Trendi',", 1)
          text = text.replace(
              "                  ? 'İlk skorların geldikçe trend burada görünür.'\n                  : 'Son oturumlardaki skor değişimi'",
              "                  ? '$exerciseTitle için form skoru oluştukça trend burada görünür.'\n                  : '$exerciseTitle oturumlarındaki form skoru değişimi'",
              1,
          )
          text = text.replace("        'Henüz çizilecek skor yok.',", "        'Henüz çizilecek form skoru yok.',", 1)
          write(path, text)

          # Home shows a trend only for the explicit selected exercise with real score samples.
          path = 'lib/features/workout_analysis/presentation/screens/home_screen.dart'
          text = read(path)
          text = text.replace(
              "import '../providers/home_dashboard_provider.dart';\n",
              "import '../providers/exercise_score_trend_provider.dart';\nimport '../providers/home_dashboard_provider.dart';\n",
              1,
          )
          text = text.replace(
              "import '../widgets/home_feature_preview_card.dart';\n",
              "import '../widgets/home_feature_preview_card.dart';\nimport '../widgets/score_trend_card.dart';\n",
              1,
          )
          text = text.replace(
              "import 'guide_screen.dart';\n",
              "import 'guide_screen.dart';\nimport 'score_trend_detail_screen.dart';\n",
              1,
          )
          text = replace_once(
              text,
              "    final selectedExercise = ref.watch(selectedExerciseProvider);\n",
              "    final selectedExercise = ref.watch(selectedExerciseProvider);\n    final trendExercise = selectedExercise;\n    final scoreTrendData = trendExercise == null\n        ? null\n        : ref.watch(exerciseScoreTrendProvider(trendExercise)).valueOrNull;\n",
              'Home selected exercise trend state',
          )
          text = replace_once(
              text,
              "            if (hasDashboardData)\n              _DashboardStats(data: dashboardData)\n            else\n              const _HomeProgressEmptyCard(),\n            const SizedBox(height: 14),",
              "            if (hasDashboardData)\n              _DashboardStats(data: dashboardData)\n            else\n              const _HomeProgressEmptyCard(),\n            if (trendExercise != null && scoreTrendData?.hasRealData == true) ...[\n              const SizedBox(height: 14),\n              ScoreTrendCard(\n                exerciseTitle: trendExercise.title,\n                points: scoreTrendData!.latestPoints(),\n                onTap: () {\n                  Navigator.push(\n                    context,\n                    MaterialPageRoute(\n                      builder: (_) => ScoreTrendDetailScreen(\n                        exercise: trendExercise,\n                      ),\n                    ),\n                  );\n                },\n              ),\n            ],\n            const SizedBox(height: 14),",
              'Home trend section',
          )
          write(path, text)

          # Detail screen consumes the same exercise-specific provider.
          path = 'lib/features/workout_analysis/presentation/screens/score_trend_detail_screen.dart'
          text = read(path)
          text = text.replace("import '../../application/workout_statistics_calculator.dart';\n", '')
          text = text.replace(
              "import '../providers/user_sessions_snapshot_provider.dart';\n",
              "import '../../domain/models/exercise_type.dart';\nimport '../providers/exercise_score_trend_provider.dart';\nimport '../providers/user_sessions_snapshot_provider.dart';\n",
              1,
          )
          text = replace_once(
              text,
              "class ScoreTrendDetailScreen extends ConsumerWidget {\n  const ScoreTrendDetailScreen({super.key});\n",
              "class ScoreTrendDetailScreen extends ConsumerWidget {\n  const ScoreTrendDetailScreen({super.key, required this.exercise});\n\n  final ExerciseType exercise;\n",
              'detail constructor',
          )
          text = replace_once(
              text,
              "    final snapshotState = ref.watch(userSessionsSnapshotProvider);\n\n    return AppScaffoldShell(\n      title: 'Skor Trendi',",
              "    final trendState = ref.watch(exerciseScoreTrendProvider(exercise));\n\n    return AppScaffoldShell(\n      title: '${exercise.title} Form Skoru Trendi',",
              'detail provider and title',
          )
          start = text.index('      body: snapshotState.when(')
          end = text.index('    );\n  }\n}\n\nclass _ScoreTrendDetailContent', start)
          new_body = """      body: trendState.when(
        loading: () => const Center(
          child: CircularProgressIndicator(color: Colors.greenAccent),
        ),
        error: (_, _) => const _ScoreTrendEmptyState(
          message: 'Form skoru verisi alınamadı.',
          detail: 'Biraz sonra tekrar deneyebilirsin.',
        ),
        data: (trendData) {
          final points = _buildDetailPoints(trendData.samples);

          if (points.isEmpty) {
            final didFail =
                trendData.source == UserSessionsSnapshotSource.error;

            return _ScoreTrendEmptyState(
              message: didFail
                  ? '${exercise.title} form skoru trendi hazırlanamadı.'
                  : '${exercise.title} için henüz form skoru trendi yok.',
              detail: didFail
                  ? 'Biraz sonra tekrar deneyebilirsin.'
                  : 'Bu egzersizde form skoru üreten analizler tamamlandığında değişim burada görünür.',
            );
          }

          return _ScoreTrendDetailContent(
            exerciseTitle: exercise.title,
            points: points,
            bestScore: trendData.bestAverageScore,
          );
        },
      ),
"""
          text = text[:start] + new_body + text[end:]
          text = replace_once(
              text,
              "  const _ScoreTrendDetailContent({\n    required this.points,\n    required this.bestScore,\n  });\n\n  final List<_ScoreTrendDetailPoint> points;",
              "  const _ScoreTrendDetailContent({\n    required this.exerciseTitle,\n    required this.points,\n    required this.bestScore,\n  });\n\n  final String exerciseTitle;\n  final List<_ScoreTrendDetailPoint> points;",
              'detail content constructor',
          )
          text = text.replace("                const Text(\n                  'Ortalama skor gelişimi',", "                Text(\n                  '$exerciseTitle form skoru gelişimi',", 1)
          text = text.replace(
              "                const Text(\n                  'Kaydedilmiş oturumların tarih sırasına göre daha geniş görünümü.',",
              "                Text(\n                  '$exerciseTitle oturumlarının tarih sırasına göre form skoru değişimi.',",
              1,
          )
          text = text.replace("                            label: 'Son Skor',", "                            label: 'Son Form Skoru',", 1)
          text = text.replace("                            label: 'En İyi',", "                            label: 'En İyi Form Skoru',", 1)
          write(path, text)

          # Update HomeDashboardData fixtures now that global scoreTrend is gone.
          fixture_paths = [
              'test/features/workout_analysis/presentation/screens/home_screen_test.dart',
              'test/features/workout_analysis/presentation/screens/home_truthful_metrics_test.dart',
              'test/features/workout_analysis/presentation/screens/workout_summary_screen_test.dart',
          ]
          for fixture_path in fixture_paths:
              text = read(fixture_path)
              text = re.sub(
                  r"\n\s*scoreTrend:\s*(?:<ScoreTrendPoint>)?\[[\s\S]*?\],",
                  '',
                  text,
              )
              write(fixture_path, text)

          # Home dashboard test no longer asserts an ambiguous global trend.
          path = 'test/features/workout_analysis/presentation/providers/home_dashboard_provider_test.dart'
          text = read(path)
          text = text.replace(
              "    'real snapshot uses canonical score eligibility and the last seven scores',",
              "    'real snapshot keeps universal and distribution dashboard aggregates',",
              1,
          )
          text = re.sub(
              r"\n      expect\(\n        data\.scoreTrend\.map\([\s\S]*?\n      \);",
              '',
              text,
              count=1,
          )
          write(path, text)

          # Application-level regression proves samples retain exercise identity and filter like-with-like.
          path = 'test/features/workout_analysis/application/workout_statistics_calculator_test.dart'
          text = read(path)
          insert_at = text.index("  test(\n    'bestAverageScore stays tied")
          new_test = """  test('score samples can be filtered by explicit exercise context', () {
    final statistics = WorkoutStatisticsCalculator().calculate([
      buildWorkoutSession(
        id: 'squat-1',
        startedAt: DateTime(2024, 1, 1, 9),
        exerciseType: 'squat',
        averageScore: 70,
      ),
      buildWorkoutSession(
        id: 'push-1',
        startedAt: DateTime(2024, 1, 2, 9),
        exerciseType: 'push_up',
        averageScore: 95,
      ),
      buildWorkoutSession(
        id: 'squat-2',
        startedAt: DateTime(2024, 1, 3, 9),
        exerciseType: 'squat',
        averageScore: 80,
      ),
      buildWorkoutSession(
        id: 'plank-hold',
        startedAt: DateTime(2024, 1, 4, 9),
        exerciseType: 'plank',
        analysisKind: 'hold',
        totalReps: 0,
        averageScore: 0,
        bestScore: 0,
      ),
    ]);

    expect(
      statistics
          .scoreSamplesForExercise('squat')
          .map((sample) => sample.score)
          .toList(growable: false),
      <double>[70, 80],
    );
    expect(
      statistics
          .scoreSamplesForExercise('push_up')
          .map((sample) => sample.score)
          .toList(growable: false),
      <double>[95],
    );
    expect(statistics.scoreSamplesForExercise('plank'), isEmpty);
  });

"""
          text = text[:insert_at] + new_test + text[insert_at:]
          write(path, text)

          # Dedicated provider tests prove no cross-exercise lines and no hold zero semantics.
          write(
              'test/features/workout_analysis/presentation/providers/exercise_score_trend_provider_test.dart',
              """import 'package:flutter_test/flutter_test.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:pose_estimation_app/features/workout_analysis/domain/models/exercise_type.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/providers/exercise_score_trend_provider.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/providers/user_sessions_snapshot_provider.dart';

import '../../../../support/workout_statistics_test_support.dart';

void main() {
  test('trend provider keeps score samples within one exercise context', () async {
    final snapshot = UserSessionsSnapshot(
      sessions: [
        buildWorkoutSession(
          id: 'squat-1',
          startedAt: DateTime(2024, 1, 1, 9),
          exerciseType: 'squat',
          averageScore: 70,
        ),
        buildWorkoutSession(
          id: 'push-1',
          startedAt: DateTime(2024, 1, 2, 9),
          exerciseType: 'push_up',
          averageScore: 95,
        ),
        buildWorkoutSession(
          id: 'squat-2',
          startedAt: DateTime(2024, 1, 3, 9),
          exerciseType: 'squat',
          averageScore: 80,
        ),
        buildWorkoutSession(
          id: 'plank-hold',
          startedAt: DateTime(2024, 1, 4, 9),
          exerciseType: 'plank',
          analysisKind: 'hold',
          totalReps: 0,
          averageScore: 0,
          bestScore: 0,
        ),
      ],
      source: UserSessionsSnapshotSource.real,
    );
    final container = ProviderContainer(
      overrides: [
        userSessionsSnapshotProvider.overrideWith((ref) async => snapshot),
      ],
    );
    addTearDown(container.dispose);

    final squat = await container.read(
      exerciseScoreTrendProvider(ExerciseType.squat).future,
    );
    final pushUp = await container.read(
      exerciseScoreTrendProvider(ExerciseType.pushUp).future,
    );
    final plank = await container.read(
      exerciseScoreTrendProvider(ExerciseType.plank).future,
    );

    expect(squat.exercise, ExerciseType.squat);
    expect(
      squat.samples.map((sample) => sample.score).toList(growable: false),
      <double>[70, 80],
    );
    expect(
      pushUp.samples.map((sample) => sample.score).toList(growable: false),
      <double>[95],
    );
    expect(plank.samples, isEmpty);
    expect(plank.hasRealData, isFalse);
  });
}
""",
          )

          # Detail screen test proves explicit exercise title and same-exercise samples only.
          path = 'test/features/workout_analysis/presentation/screens/score_trend_detail_screen_test.dart'
          write(
              path,
              """import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:pose_estimation_app/features/workout_analysis/domain/models/exercise_type.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/providers/user_sessions_snapshot_provider.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/screens/score_trend_detail_screen.dart';

import '../../../../support/workout_statistics_test_support.dart';

void main() {
  testWidgets(
    'detail screen shows only the explicit exercise form-score trend',
    (tester) async {
      final snapshot = UserSessionsSnapshot(
        sessions: [
          buildWorkoutSession(
            id: 'squat-1',
            startedAt: DateTime(2024, 1, 1, 9),
            exerciseType: 'squat',
            totalReps: 10,
            averageScore: 60,
            bestScore: 95,
          ),
          buildWorkoutSession(
            id: 'push-1',
            startedAt: DateTime(2024, 1, 2, 9),
            exerciseType: 'push_up',
            totalReps: 12,
            averageScore: 99,
            bestScore: 100,
          ),
          buildWorkoutSession(
            id: 'squat-2',
            startedAt: DateTime(2024, 1, 3, 9),
            exerciseType: 'squat',
            totalReps: 8,
            averageScore: 65,
            bestScore: 90,
          ),
          buildWorkoutSession(
            id: 'plank-hold',
            startedAt: DateTime(2024, 1, 4, 9),
            exerciseType: 'plank',
            analysisKind: 'hold',
            totalReps: 0,
            averageScore: 0,
            bestScore: 0,
          ),
        ],
        source: UserSessionsSnapshotSource.real,
      );

      await tester.pumpWidget(
        ProviderScope(
          overrides: [
            userSessionsSnapshotProvider.overrideWith((ref) async => snapshot),
          ],
          child: const MaterialApp(
            home: ScoreTrendDetailScreen(exercise: ExerciseType.squat),
          ),
        ),
      );
      await tester.pumpAndSettle();

      expect(find.text('Squat Form Skoru Trendi'), findsOneWidget);
      expect(find.text('01.01'), findsOneWidget);
      expect(find.text('03.01'), findsOneWidget);
      expect(find.text('02.01'), findsNothing);
      expect(find.text('04.01'), findsNothing);
      expect(find.text('Oturum'), findsOneWidget);
      expect(find.text('2'), findsOneWidget);
      expect(find.text('Son Form Skoru'), findsOneWidget);
      expect(find.text('En İyi Form Skoru'), findsOneWidget);
      expect(find.text('65'), findsAtLeastNWidgets(1));
      expect(find.text('99'), findsNothing);
    },
  );
}
""",
          )

          # Home regression: mini trend is selected-exercise-specific and hold-only data does not render a score trend.
          write(
              'test/features/workout_analysis/presentation/screens/home_exercise_score_trend_test.dart',
              """import 'package:flutter_test/flutter_test.dart';
import 'package:pose_estimation_app/features/achievements/presentation/models/achievement.dart';
import 'package:pose_estimation_app/features/achievements/presentation/providers/achievements_provider.dart';
import 'package:pose_estimation_app/features/goals/presentation/models/workout_goal.dart';
import 'package:pose_estimation_app/features/goals/presentation/providers/goals_provider.dart';
import 'package:pose_estimation_app/features/workout_analysis/domain/models/exercise_type.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/providers/selected_exercise_provider.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/providers/user_sessions_snapshot_provider.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/screens/home_screen.dart';
import 'package:pose_estimation_app/features/workout_analysis/presentation/screens/score_trend_detail_screen.dart';

import '../../../../support/presentation_test_support.dart';
import '../../../../support/workout_statistics_test_support.dart';

void main() {
  testWidgets('Home mini trend uses the selected exercise context', (tester) async {
    final snapshot = UserSessionsSnapshot(
      sessions: [
        buildWorkoutSession(
          id: 'squat-1',
          startedAt: DateTime(2024, 1, 1, 9),
          exerciseType: 'squat',
          averageScore: 70,
        ),
        buildWorkoutSession(
          id: 'push-1',
          startedAt: DateTime(2024, 1, 2, 9),
          exerciseType: 'push_up',
          averageScore: 99,
        ),
        buildWorkoutSession(
          id: 'squat-2',
          startedAt: DateTime(2024, 1, 3, 9),
          exerciseType: 'squat',
          averageScore: 80,
        ),
      ],
      source: UserSessionsSnapshotSource.real,
    );

    await pumpTestApp(
      tester,
      home: const HomeScreen(),
      overrides: [
        userSessionsSnapshotProvider.overrideWith((ref) async => snapshot),
        selectedExerciseProvider.overrideWith((ref) => ExerciseType.squat),
        goalsProvider.overrideWith(
          (ref) => const GoalsState(
            source: GoalsDataSource.real,
            goals: <WorkoutGoal>[],
          ),
        ),
        achievementsProvider.overrideWith(
          (ref) => const AchievementsState(
            source: AchievementsDataSource.real,
            achievements: <Achievement>[],
          ),
        ),
      ],
    );
    await tester.pumpAndSettle();

    expect(find.text('Squat Form Skoru Trendi'), findsOneWidget);
    expect(find.text('Push-up Form Skoru Trendi'), findsNothing);

    await tester.tap(find.text('Detayı Gör'));
    await tester.pumpAndSettle();

    expect(find.byType(ScoreTrendDetailScreen), findsOneWidget);
    expect(find.text('Squat Form Skoru Trendi'), findsOneWidget);
  });

  testWidgets('Home does not show a form-score trend for hold-only history', (
    tester,
  ) async {
    final snapshot = UserSessionsSnapshot(
      sessions: [
        buildWorkoutSession(
          id: 'plank-hold',
          startedAt: DateTime(2024, 1, 1, 9),
