name: Temporary Roadmap 03 Format All

on:
  push:
    branches:
      - refactor/frontend-roadmap-03-remove-production-demo-fallback-data

permissions:
  contents: write

jobs:
  format-all:
    if: ${{ !contains(github.event.head_commit.message, 'Format all Roadmap 3 Dart changes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-03-remove-production-demo-fallback-data

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format all changed Dart files
        run: |
          dart format \
            lib/features/achievements/presentation/providers/achievements_provider.dart \
            lib/features/achievements/presentation/screens/achievements_screen.dart \
            lib/features/goals/presentation/providers/goals_provider.dart \
            lib/features/goals/presentation/screens/goals_screen.dart \
            lib/features/workout_analysis/presentation/models/home_dashboard_data.dart \
            lib/features/workout_analysis/presentation/providers/home_dashboard_provider.dart \
            test/features/achievements/presentation/providers/achievements_provider_test.dart \
            test/features/achievements/presentation/screens/achievements_screen_test.dart \
            test/features/goals/presentation/providers/goals_provider_test.dart \
            test/features/goals/presentation/screens/goals_screen_test.dart \
            test/features/workout_analysis/presentation/providers/home_dashboard_provider_test.dart \
            test/features/workout_analysis/presentation/screens/home_screen_test.dart
          rm .github/workflows/tmp-roadmap-03-format-all.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format all Roadmap 3 Dart changes"
          git push origin HEAD:refactor/frontend-roadmap-03-remove-production-demo-fallback-data
