name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture formatter diff
        run: |
          dart format .
          git diff > format.diff

      - name: Upload formatter diff
        uses: actions/upload-artifact@v4
        with:
          name: format-diff
          path: format.diff
          if-no-files-found: error
