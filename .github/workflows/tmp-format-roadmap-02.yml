name: Temporary Roadmap 02 Formatter

on:
  push:
    branches:
      - refactor/frontend-roadmap-02-exercise-specific-score-trends

permissions:
  contents: write

jobs:
  format-and-clean:
    if: ${{ !contains(github.event.head_commit.message, 'Format Roadmap 2 changes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-02-exercise-specific-score-trends

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart files
        run: dart format .

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-format-roadmap-02.yml

      - name: Commit formatted changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Roadmap 2 changes"
          git push origin HEAD:refactor/frontend-roadmap-02-exercise-specific-score-trends
