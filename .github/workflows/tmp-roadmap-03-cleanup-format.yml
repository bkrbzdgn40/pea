name: Temporary Roadmap 03 Cleanup Format

on:
  push:
    branches:
      - refactor/frontend-roadmap-03-remove-production-demo-fallback-data

permissions:
  contents: write

jobs:
  cleanup-format:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize truthful production fallback states') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-roadmap-03-remove-production-demo-fallback-data

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove compatibility aliases and update references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'GoalsDataSource.demoNoUser': 'GoalsDataSource.noUser',
              'GoalsDataSource.demoEmpty': 'GoalsDataSource.empty',
              'GoalsDataSource.demoError': 'GoalsDataSource.error',
              'AchievementsDataSource.demoNoUser': 'AchievementsDataSource.noUser',
              'AchievementsDataSource.demoEmpty': 'AchievementsDataSource.empty',
              'AchievementsDataSource.demoError': 'AchievementsDataSource.error',
              'HomeDashboardSource.demoNoUser': 'HomeDashboardSource.noUser',
              'HomeDashboardSource.demoEmpty': 'HomeDashboardSource.empty',
              'HomeDashboardSource.demoError': 'HomeDashboardSource.error',
          }

          changed = set()
          for root in (Path('lib'), Path('test')):
              for path in root.rglob('*.dart'):
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.add(str(path))

          alias_blocks = {
              'lib/features/goals/presentation/providers/goals_provider.dart': '''\n  static const demoNoUser = noUser;\n  static const demoEmpty = empty;\n  static const demoError = error;\n''',
              'lib/features/achievements/presentation/providers/achievements_provider.dart': '''\n  static const demoNoUser = noUser;\n  static const demoEmpty = empty;\n  static const demoError = error;\n''',
              'lib/features/workout_analysis/presentation/models/home_dashboard_data.dart': '''\n  static const demoNoUser = noUser;\n  static const demoEmpty = empty;\n  static const demoError = error;\n''',
          }
          for filename, block in alias_blocks.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if block not in text:
                  raise RuntimeError(f'Missing alias block in {filename}')
              path.write_text(text.replace(block, '\n', 1), encoding='utf-8')
              changed.add(filename)

          Path('.tmp-roadmap3-changed.txt').write_text(
              '\n'.join(sorted(changed)) + '\n',
              encoding='utf-8',
          )

      - name: Format changed Dart files
        shell: bash
        run: |
          mapfile -t files < .tmp-roadmap3-changed.txt
          dart format "${files[@]}"
          rm .tmp-roadmap3-changed.txt
          rm .github/workflows/tmp-roadmap-03-cleanup-format.yml

      - name: Commit cleanup and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize truthful production fallback states"
          git push origin HEAD:refactor/frontend-roadmap-03-remove-production-demo-fallback-data
